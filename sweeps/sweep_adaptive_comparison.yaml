global:
  EXAMPLE: 3
  LENGTH: 1.0
  TOTAL_TIME: 1.0
  N_POINTS_X: 100
  N_POINTS_T: 100
  LAYERS: 2
  NEURONS_PER_LAYER: 100
  KAN_LAYERS: 2
  KAN_NEURONS_PER_LAYER: 10
  KAN_SPLINE_TYPE: "nurbs"
  ACTIVATION: "tanh"
  IGA_DEGREE: 3
  IGA_ELEMENTS: 32
  H1_CALC_EVERY: 100

sweep:
  RPINN: [0, 1]
  SAMPLER_TYPE: ["uniform", "boundary_layer"]
  EPSILON: [0.001, 0.01]

scenarios:
  # Neural Network (PINN & KAN) Solver Runs
  - name: "adaptive_nn"
    SOLVERS: ["pinn", "kan"]
    SAMPLER_GAMMA: 3.0

  # IGA Solver Runs (automatically deduplicated across NN-only sweep parameters)
  - name: "adaptive_iga_uniform_supg"
    SOLVERS: ["iga"]
    IGA_METHOD: "supg"
    IGA_MESH_TYPE: "uniform"

  - name: "adaptive_iga_adaptive_supg"
    SOLVERS: ["iga"]
    IGA_METHOD: "supg"
    IGA_MESH_TYPE: "adaptive"
    IGA_ADAPTIVE_GAMMA: 3.0

  - name: "adaptive_iga_adaptive_igrm"
    SOLVERS: ["iga"]
    IGA_METHOD: "igrm"
    IGA_MESH_TYPE: "adaptive"
    IGA_ADAPTIVE_GAMMA: 3.0
