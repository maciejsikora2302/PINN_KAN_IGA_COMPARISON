global:
  EXAMPLE: 3
  LENGTH: 1.0
  TOTAL_TIME: 1.0
  N_POINTS_X: 100
  N_POINTS_T: 100
  LAYERS: 2
  NEURONS_PER_LAYER: 100
  KAN_LAYERS: 2
  KAN_NEURONS_PER_LAYER: 10
  KAN_SPLINE_TYPE: "nurbs"
  ACTIVATION: "tanh"
  IGA_DEGREE: 3
  IGA_ELEMENTS: 32
  H1_CALC_EVERY: 100

sweep:
  RPINN: [0, 1]

scenarios:
  # --- Neural Network (PINN & KAN) Solver Runs ---
  - name: "ej_eps100_nn"
    SOLVERS: ["pinn", "kan"]
    EPSILON: 1.0

  - name: "ej_eps010_nn"
    SOLVERS: ["pinn", "kan"]
    EPSILON: 0.1

  - name: "ej_eps001_nn"
    SOLVERS: ["pinn", "kan"]
    EPSILON: 0.01

  - name: "ej_eps0001_nn"
    SOLVERS: ["pinn", "kan"]
    EPSILON: 0.001

  # --- IGA Solver Runs (Independent of RPINN settings) ---
  # Moderate diffusion
  - name: "ej_eps100_iga"
    SOLVERS: ["iga"]
    EPSILON: 1.0
    IGA_METHOD: "standard"
    IGA_MESH_TYPE: "uniform"

  # Intermediate advection-diffusion
  - name: "ej_eps010_iga"
    SOLVERS: ["iga"]
    EPSILON: 0.1
    IGA_METHOD: "supg"
    IGA_MESH_TYPE: "uniform"

  # Strong advection-diffusion
  - name: "ej_eps001_supg_iga"
    SOLVERS: ["iga"]
    EPSILON: 0.01
    IGA_METHOD: "supg"
    IGA_MESH_TYPE: "uniform"

  - name: "ej_eps001_igrm_iga"
    SOLVERS: ["iga"]
    EPSILON: 0.01
    IGA_METHOD: "igrm"
    IGA_MESH_TYPE: "uniform"

  # Highly advection-dominated boundary layer
  - name: "ej_eps0001_supg_iga"
    SOLVERS: ["iga"]
    EPSILON: 0.001
    IGA_METHOD: "supg"
    IGA_MESH_TYPE: "adaptive"
    IGA_ADAPTIVE_GAMMA: 3.5

  - name: "ej_eps0001_igrm_iga"
    SOLVERS: ["iga"]
    EPSILON: 0.001
    IGA_METHOD: "igrm"
    IGA_MESH_TYPE: "adaptive"
    IGA_ADAPTIVE_GAMMA: 3.5
