global:
  EXAMPLE: 3
  LENGTH: 1.0
  TOTAL_TIME: 1.0
  N_POINTS_X: 100
  N_POINTS_T: 100
  LAYERS: 2
  NEURONS_PER_LAYER: 100
  KAN_LAYERS: 2
  KAN_NEURONS_PER_LAYER: 10
  KAN_SPLINE_TYPE: "nurbs"
  ACTIVATION: "tanh"
  LEARNING_RATE: 0.0005
  IGA_DEGREE: 3
  IGA_ELEMENTS: 32
  H1_CALC_EVERY: 100

sweep:
  RPINN: [0, 1]

scenarios:
  # Moderate diffusion (eps = 1.0)
  - name: "ej_eps100"
    EPSILON: 1.0
    EPOCHS: 20000
    IGA_METHOD: "standard"
    IGA_MESH_TYPE: "uniform"

  # Intermediate advection-diffusion (eps = 0.1)
  - name: "ej_eps010"
    EPSILON: 0.1
    EPOCHS: 30000
    IGA_METHOD: "supg"
    IGA_MESH_TYPE: "uniform"

  # Strong advection-diffusion (eps = 0.01)
  - name: "ej_eps001_supg"
    EPSILON: 0.01
    EPOCHS: 40000
    IGA_METHOD: "supg"
    IGA_MESH_TYPE: "uniform"

  - name: "ej_eps001_igrm"
    EPSILON: 0.01
    EPOCHS: 40000
    IGA_METHOD: "igrm"
    IGA_MESH_TYPE: "uniform"

  # Highly advection-dominated boundary layer (eps = 0.001)
  - name: "ej_eps0001_supg"
    EPSILON: 0.001
    EPOCHS: 50000
    IGA_METHOD: "supg"
    IGA_MESH_TYPE: "adaptive"
    IGA_ADAPTIVE_GAMMA: 3.5

  - name: "ej_eps0001_igrm"
    EPSILON: 0.001
    EPOCHS: 50000
    IGA_METHOD: "igrm"
    IGA_MESH_TYPE: "adaptive"
    IGA_ADAPTIVE_GAMMA: 3.5
