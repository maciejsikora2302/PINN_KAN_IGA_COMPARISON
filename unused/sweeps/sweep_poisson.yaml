global:
  LENGTH: 1.0
  TOTAL_TIME: 1.0
  N_POINTS_X: 100
  N_POINTS_T: 100
  LAYERS: 2
  NEURONS_PER_LAYER: 100
  KAN_LAYERS: 2
  KAN_NEURONS_PER_LAYER: 10
  KAN_SPLINE_TYPE: "nurbs"
  KAN_GRID_SIZE: 5
  KAN_SPLINE_ORDER: 3
  ACTIVATION: "tanh"
  SAMPLER_TYPE: "uniform"
  IGA_DEGREE: 3
  IGA_ELEMENTS: 32
  IGA_METHOD: "standard"
  IGA_MESH_TYPE: "uniform"
  H1_CALC_EVERY: 100

sweep:
  RPINN: [0, 1]

scenarios:
  # PINN & KAN solver runs
  - name: "poisson_sin_nn"
    SOLVERS: ["pinn", "kan"]
    EXAMPLE: 1
    LEARNING_RATE: 0.001
    KAN_LEARNING_RATE: 0.001

  - name: "poisson_exp_nn"
    SOLVERS: ["pinn", "kan"]
    EXAMPLE: 2
    LEARNING_RATE: 0.0005
    KAN_LEARNING_RATE: 0.001

  # IGA solver runs (independent of neural network RPINN settings)
  - name: "poisson_sin_iga"
    SOLVERS: ["iga"]
    EXAMPLE: 1

  - name: "poisson_exp_iga"
    SOLVERS: ["iga"]
    EXAMPLE: 2
